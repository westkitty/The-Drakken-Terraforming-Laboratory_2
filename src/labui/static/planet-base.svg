    </radialGradient>
    <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#0b2734" stop-opacity=".9"/><stop offset=".62" stop-color="#031018" stop-opacity=".96"/><stop offset="1" stop-color="#010509"/></linearGradient>
    <linearGradient id="beam" x1="0" y1="1" x2="0" y2="0"><stop stop-color="#45e5ff" stop-opacity=".13"/><stop offset=".7" stop-color="#45e5ff" stop-opacity=".025"/><stop offset="1" stop-color="#45e5ff" stop-opacity="0"/></linearGradient>
